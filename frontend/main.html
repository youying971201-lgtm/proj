<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>道路 Gate 校正</title><style>
*{box-sizing:border-box}body{background:#737373;color:#202124;font:14px system-ui;margin:0;min-height:100vh;padding:24px}.app{background:#fff;border-radius:12px;box-shadow:0 12px 36px #0004;display:grid;grid-template-columns:minmax(600px,1fr) 88px;gap:16px;max-width:1180px;margin:auto;padding:20px}.steps{display:flex;gap:8px;margin-bottom:16px}.step{background:#dedfe1;border-radius:9px;color:#777;font-weight:700;padding:10px 18px}.step.active{background:#777;color:#fff}.step.done{background:#aeb3b7;color:#fff}.stage{background:#000;border-radius:12px;display:grid;min-height:555px;place-items:center;overflow:hidden}.wrap{position:relative;max-height:555px;max-width:100%}.wrap img{display:block;max-height:555px;max-width:100%}.wrap canvas{cursor:crosshair;inset:0;position:absolute;width:100%;height:100%}.bottom{align-items:center;background:#dedede;border-radius:8px;display:flex;gap:12px;margin-top:12px;padding:10px 14px}.status{color:#555;flex:1;font-weight:600}.lane-default{align-items:center;display:flex;font-weight:700;gap:8px;white-space:nowrap}.lane-default input,.gate-row input{border:1px solid #aaa;border-radius:4px;font:inherit;padding:6px;width:56px}.start{background:#666;border:0;border-radius:5px;color:#fff;cursor:pointer;font-weight:800;padding:10px 18px}.start:disabled{background:#aaa;cursor:not-allowed}.gate-panel{background:#f0f0f0;border-radius:8px;margin-top:10px;padding:10px 14px}.gate-panel h3{font-size:13px;margin:0 0 7px}.gate-list{display:flex;gap:8px;max-height:82px;overflow-x:auto;padding-bottom:4px}.gate-row{align-items:center;background:#fff;border:1px solid #ddd;border-radius:5px;display:flex;gap:6px;padding:7px;white-space:nowrap}.gate-row span{font-weight:700}.tools{align-items:center;background:#8e8e8e;border-radius:14px;display:flex;flex-direction:column;gap:10px;padding:12px 8px}.tool{align-items:center;background:#dedede;border:0;border-radius:50%;color:#454545;cursor:pointer;display:flex;font-size:18px;height:42px;justify-content:center;width:42px}.tool.active{background:#333;color:#fff}.tool:disabled{cursor:not-allowed;opacity:.4}.divider{background:#d7d7d7;height:1px;margin:2px 0;width:46px}.swatch{border:3px solid #fff;box-shadow:0 0 0 1px #555;height:24px;width:24px}.tip{color:#777;font-size:12px;margin:12px 0 0;text-align:center}@media(max-width:760px){body{padding:0}.app{border-radius:0;grid-template-columns:1fr 66px;padding:10px}.step{font-size:11px;padding:8px}.stage{min-height:400px}.bottom{align-items:stretch;flex-direction:column}}
</style></head><body><div class="app"><main><nav class="steps"><span class="step active" id="previewStep">畫面預覽</span><span class="step" id="stopStep">設定停止線</span><span class="step" id="gateStep">設定閘門</span><span class="step" id="runStep">開始判斷</span></nav><section class="stage"><div class="wrap"><img id="stream" alt="影片第一幀"><canvas id="canvas"></canvas></div></section><section class="bottom"><span class="status" id="status">正在準備影片第一幀…</span><label class="lane-default">預設車道數 <input id="defaultLane" type="number" min="1" value="1" disabled></label><button class="start" id="start" disabled>開始判斷</button></section><section class="gate-panel"><h3>Gate 預覽（依設定順序）</h3><div class="gate-list" id="gateList"><span>尚未設定 Gate</span></div></section><p class="tip">按住左鍵拖曳：按下為 L、放開為 R。每條 Gate 自動使用目前的預設車道數。</p></main><aside class="tools"><button class="tool active" id="draw" title="線段繪製">╱</button><button class="tool" id="undo" title="上一步">↶</button><button class="tool" id="redo" title="重做">⟳</button><span class="divider"></span><button class="tool swatch" id="colour" title="切換 Gate 顏色"></button></aside></div><script>
const image=document.querySelector('#stream'),canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d'),status=document.querySelector('#status'),drawButton=document.querySelector('#draw'),undoButton=document.querySelector('#undo'),redoButton=document.querySelector('#redo'),colourButton=document.querySelector('#colour'),startButton=document.querySelector('#start'),defaultLaneInput=document.querySelector('#defaultLane'),gateList=document.querySelector('#gateList');
const steps={preview:document.querySelector('#previewStep'),stop:document.querySelector('#stopStep'),gate:document.querySelector('#gateStep'),run:document.querySelector('#runStep')},colours=['#24b576','#2987d8','#f0a326','#a55eea'];let stopLine=null,gates=[],redoStack=[],dragStart=null,dragEnd=null,drawing=true,colourIndex=0;
function resize(){canvas.width=image.clientWidth;canvas.height=image.clientHeight;paintAll()}image.onload=()=>{resize();progress('stop');status.textContent='請拉線設定停止線。'};image.onerror=()=>status.textContent='❌ 第一幀載入失敗，請確認主程式與影片檔。';image.src='/first_frame.jpg?'+Date.now();addEventListener('resize',resize);
function normal(event){const r=canvas.getBoundingClientRect();return{x:Number(((event.clientX-r.left)/r.width).toFixed(5)),y:Number(((event.clientY-r.top)/r.height).toFixed(5))}}function onScreen(p){return{x:p.x*canvas.width,y:p.y*canvas.height}}function paint(line,color,label){if(!line)return;const a=onScreen(line.L),b=onScreen(line.R);ctx.strokeStyle=color;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.fillStyle=color;ctx.font='bold 14px system-ui';ctx.fillText(label,a.x+7,a.y-8)}function paintAll(){ctx.clearRect(0,0,canvas.width,canvas.height);paint(stopLine,'#e75050','停止線');gates.forEach(g=>paint(g.line,g.color,`${g.gate}｜${g.lane} 車道`));if(dragStart&&dragEnd)paint({L:dragStart,R:dragEnd},colours[colourIndex],'預覽')}
function progress(active){const names=['preview','stop','gate','run'],at=names.indexOf(active);names.forEach((name,i)=>steps[name].className=`step ${i<at?'done':i===at?'active':''}`)}function refresh(){progress(stopLine?(gates.length>=3?'run':'gate'):'stop');defaultLaneInput.disabled=!stopLine;undoButton.disabled=!stopLine;redoButton.disabled=!redoStack.length;startButton.disabled=gates.length<3;colourButton.style.background=colours[colourIndex];drawButton.classList.toggle('active',drawing);gateList.innerHTML=gates.length?gates.map((g,i)=>`<label class="gate-row"><span>Gate ${i+1}</span><input type="number" min="1" value="${g.lane}" data-index="${i}"> 車道</label>`).join(''):'<span>尚未設定 Gate</span>';paintAll()}
function addLine(line){if(!stopLine){stopLine=line;status.textContent='✅ 停止線完成，請在下方確認預設車道數後標示 Gate 1。';defaultLaneInput.focus()}else{const lane=Number(defaultLaneInput.value);if(!Number.isInteger(lane)||lane<1){status.textContent='❌ 請填寫有效的預設車道數。';defaultLaneInput.focus();return}const order=gates.length+1;gates.push({gate:`Gate ${order}`,lane,station_m:order*10,line,color:colours[colourIndex]});redoStack=[];status.textContent=`✅ Gate ${order} 完成（${lane} 車道），可繼續標示 Gate ${order+1}。`}refresh()}
canvas.onpointerdown=e=>{if(e.button!==0||!drawing||!image.naturalWidth)return;dragStart=normal(e);dragEnd=dragStart;canvas.setPointerCapture(e.pointerId);paintAll();e.preventDefault()};canvas.onpointermove=e=>{if(!dragStart)return;dragEnd=normal(e);paintAll()};canvas.onpointerup=e=>{if(!dragStart)return;const line={L:dragStart,R:normal(e)};dragStart=dragEnd=null;if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);addLine(line)};canvas.onpointercancel=()=>{dragStart=dragEnd=null;paintAll()};
gateList.onchange=e=>{const input=e.target;if(!input.matches('[data-index]'))return;const gate=gates[Number(input.dataset.index)],lane=Number(input.value);if(!Number.isInteger(lane)||lane<1){input.value=gate.lane;return}gate.lane=lane;status.textContent=`${gate.gate} 已改為 ${lane} 車道。`;refresh()};drawButton.onclick=()=>{drawing=!drawing;status.textContent=drawing?'線段繪製已啟用。':'線段繪製已暫停。';refresh()};undoButton.onclick=()=>{if(gates.length)redoStack.push(gates.pop());else if(stopLine){redoStack.push({stop:true,line:stopLine});stopLine=null}status.textContent='已回到上一步。';refresh()};redoButton.onclick=()=>{const item=redoStack.pop();if(item){if(item.stop)stopLine=item.line;else gates.push(item);status.textContent='已重做。';refresh()}};colourButton.onclick=()=>{colourIndex=(colourIndex+1)%colours.length;status.textContent='已切換下一條 Gate 的顏色。';refresh()};
async function request(url){const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:url==='/save_points'?JSON.stringify({stop_line:{line:stopLine},gates:gates.map(({color,...gate})=>gate)}):undefined}),data=await response.json();if(!response.ok)throw Error(data.detail);return data}startButton.onclick=async()=>{try{await request('/save_points');await request('/start_processing');image.src='/video_feed?'+Date.now();progress('run');status.textContent='✅ 判斷已開始。'}catch(error){status.textContent='❌ '+error.message}};refresh();
</script></body></html>
