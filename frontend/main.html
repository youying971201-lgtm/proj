<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>道路 Gate 校正</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background: #737373;
      color: #202124;
      font: 14px system-ui;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    .app {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 12px 36px #0004;
      display: grid;
      grid-template-columns: minmax(600px, 1fr) 88px;
      gap: 16px;
      max-width: 1180px;
      margin: auto;
      padding: 20px;
    }
    .steps {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    .step {
      background: #dedfe1;
      border-radius: 9px;
      color: #777;
      font-weight: 700;
      padding: 10px 18px;
    }
    .step.active {
      background: #777;
      color: #fff;
    }
    .step.done {
      background: #aeb3b7;
      color: #fff;
    }
    .stage {
      background: #000;
      border-radius: 12px;
      display: grid;
      min-height: 555px;
      place-items: center;
      overflow: hidden;
    }
    .wrap {
      position: relative;
      max-height: 555px;
      max-width: 100%;
    }
    .wrap img {
      display: block;
      max-height: 555px;
      max-width: 100%;
    }
    .wrap canvas {
      cursor: crosshair;
      inset: 0;
      position: absolute;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    .bottom {
      align-items: center;
      background: #dedede;
      border-radius: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 12px;
      padding: 10px 14px;
    }
    .status {
      color: #555;
      flex: 1;
      font-weight: 600;
    }
    .device-status,
    .scale-status,
    .lane-change-status {
      color: #555;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .lane-default {
      align-items: center;
      display: flex;
      font-weight: 700;
      gap: 8px;
      white-space: nowrap;
    }
    .detection-mode {
      align-items: center;
      display: flex;
      font-weight: 700;
      gap: 8px;
      white-space: nowrap;
    }
    .mode-switch {
      display: inline-flex;
      position: relative;
    }
    .mode-switch input {
      height: 1px;
      opacity: 0;
      position: absolute;
      width: 1px;
    }
    .mode-slider {
      background: #777;
      border-radius: 14px;
      cursor: pointer;
      height: 24px;
      position: relative;
      transition: background .2s;
      width: 44px;
    }
    .mode-slider::before {
      background: #fff;
      border-radius: 50%;
      content: '';
      height: 18px;
      left: 3px;
      position: absolute;
      top: 3px;
      transition: transform .2s;
      width: 18px;
    }
    .mode-switch input:checked + .mode-slider {
      background: #2987d8;
    }
    .mode-switch input:checked + .mode-slider::before {
      transform: translateX(20px);
    }
    .mode-switch input:focus-visible + .mode-slider {
      outline: 2px solid #202124;
      outline-offset: 2px;
    }
    .lane-default input,
    .gate-row input {
      border: 1px solid #aaa;
      border-radius: 4px;
      font: inherit;
      padding: 6px;
      width: 56px;
    }
    .start {
      background: #666;
      border: 0;
      border-radius: 5px;
      color: #fff;
      cursor: pointer;
      font-weight: 800;
      padding: 10px 18px;
    }
    .start:disabled {
      background: #aaa;
      cursor: not-allowed;
    }
    .secondary {
      background: #52657a;
    }
    .gate-panel {
      background: #f0f0f0;
      border-radius: 8px;
      margin-top: 10px;
      padding: 10px 14px;
    }
    .gate-panel h3 {
      font-size: 13px;
      margin: 0 0 7px;
    }
    .gate-list {
      display: flex;
      gap: 8px;
      max-height: 82px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .gate-row {
      align-items: center;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 5px;
      display: flex;
      gap: 6px;
      padding: 7px;
      white-space: nowrap;
      cursor: pointer;
    }
    .gate-row span {
      font-weight: 700;
    }
    .tools {
      align-items: center;
      background: #8e8e8e;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px 8px;
    }
    .tool {
      align-items: center;
      background: #dedede;
      border: 0;
      border-radius: 50%;
      color: #454545;
      cursor: pointer;
      display: flex;
      font-size: 18px;
      height: 42px;
      justify-content: center;
      width: 42px;
    }
    .tool.active {
      background: #333;
      color: #fff;
    }
    .tool:disabled {
      cursor: not-allowed;
      opacity: .4;
    }
    .divider {
      background: #d7d7d7;
      height: 1px;
      margin: 2px 0;
      width: 46px;
    }
    .swatch {
      border: 3px solid #fff;
      box-shadow: 0 0 0 1px #555;
      height: 24px;
      width: 24px;
    }
    .tip {
      color: #777;
      font-size: 12px;
      margin: 12px 0 0;
      text-align: center;
    }
    @media (max-width: 760px) {
      body {
        padding: 0;
      }
      .app {
        border-radius: 0;
        grid-template-columns: 1fr 66px;
        padding: 10px;
      }
      .step {
        font-size: 11px;
        padding: 8px;
      }
      .stage {
        min-height: 400px;
      }
      .bottom {
        align-items: stretch;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <main>
      <nav class="steps">
        <span class="step active" id="previewStep">畫面預覽</span>
        <span class="step" id="stopStep">設定停止線</span>
        <span class="step" id="boundaryStep">設定道路邊界</span>
        <span class="step" id="gateStep">設定閘門</span>
        <span class="step" id="runStep">開始判斷</span>
      </nav>
      <section class="stage">
        <div class="wrap">
          <img id="stream" alt="影片第一幀">
          <canvas id="canvas" tabindex="0"></canvas>
        </div>
      </section>
      <section class="bottom">
        <span class="status" id="status">正在準備影片第一幀…</span>
        <span class="device-status" id="deviceStatus" hidden></span>
        <span class="scale-status" id="visualScaleStatus" hidden></span>
        <span class="lane-change-status" id="laneChangeStatus" hidden></span>
        <label class="lane-default">預設車道數 
          <input id="defaultLane" type="number" min="1" value="1" disabled>
        </label>
        <label class="detection-mode" title="scooter 一律使用 my_model.pt；離鏡頭的 car 也使用該模型">
          主要偵測：<strong id="detectionModeText">離鏡頭</strong>
          <span class="mode-switch">
            <input id="detectionModeSwitch" type="checkbox" role="switch" aria-label="切換入鏡頭或離鏡頭主要偵測模式">
            <span class="mode-slider" aria-hidden="true"></span>
          </span>
        </label>
        <button class="start secondary" id="finishBoundary" disabled>完成此邊界（Enter）</button>
        <button class="start secondary" id="fractionalGate" disabled>下一條為 .4 Gate</button>
        <button class="start secondary" id="exportGeometry" disabled>匯出校正 JSON</button>
        <button class="start secondary" id="importGeometry">匯入校正 JSON</button>
        <input id="importFile" type="file" accept="application/json,.json" hidden>
        <button class="start" id="start" disabled>開始判斷</button>
        <button class="start" id="resetBtn" style="background: #e75050; display: none;">重新判斷</button>
        <button class="start" id="reloadLaneNet" disabled>Reload LaneNet</button>
        <button class="start" onclick="closeApplication()" style="background: #454545;">關閉系統</button>
      </section>
      <section class="gate-panel">
        <h3>Gate 預覽（依設定順序）</h3>
        <div class="gate-list" id="gateList">
          <span>尚未設定 Gate</span>
        </div>
      </section>
      <p class="tip" id="instruction">點一下設定停止線 L 錨點，移動滑鼠預覽線段，再點一下設定 R。接著逐點標示左右邊界，按 Enter 完成。</p>
    </main>
    <aside class="tools">
      <button class="tool active" id="draw" title="線段繪製">╱</button>
      <button class="tool" id="undo" title="上一步">↶</button>
      <button class="tool" id="redo" title="重做">⟳</button>
      <span class="divider"></span>
      <button class="tool swatch" id="colour" title="切換 Gate 顏色"></button>
    </aside>
  </div>
  <script>
    function closeApplication() {
    // 1. 跳出確認彈窗
    const userConfirmed = confirm("確定要關閉視窗嗎？這將會同時關閉背景的 Python 伺服器。");

    if (userConfirmed) {
        // 2. 發送 POST 請求給後端的 /shutdown API
        fetch('/shutdown', {
            method: 'POST'
        })
        .then(() => {
            // 3. 請求成功後，關閉目前的 HTML 視窗
            // 注意：基於瀏覽器安全限制，如果視窗不是由腳本 (window.open) 開啟的，window.close() 可能會失效
            window.close();
        })
        .catch(error => {
            console.error("關閉伺服器時發生錯誤:", error);
            alert("背景伺服器已關閉或無回應，請手動關閉此網頁。");
        });
    }
  }
    window.addEventListener('beforeunload', function (e) {
    // 現代瀏覽器為了防範廣告，不允許自訂提示文字，預設就是顯示截圖中的統一文字
    e.preventDefault();
    e.returnValue = ''; 
    });

    const image = document.querySelector('#stream'),
      canvas = document.querySelector('#canvas'),
      ctx = canvas.getContext('2d'),
      status = document.querySelector('#status'),
      deviceStatus = document.querySelector('#deviceStatus'),
      visualScaleStatus = document.querySelector('#visualScaleStatus'),
      laneChangeStatus = document.querySelector('#laneChangeStatus'),
      drawButton = document.querySelector('#draw'),
      undoButton = document.querySelector('#undo'),
      redoButton = document.querySelector('#redo'),
      colourButton = document.querySelector('#colour'),
      startButton = document.querySelector('#start'),
      reloadButton = document.querySelector('#reloadLaneNet'),
      defaultLaneInput = document.querySelector('#defaultLane'),
      detectionModeSwitch = document.querySelector('#detectionModeSwitch'),
      detectionModeText = document.querySelector('#detectionModeText'),
      gateList = document.querySelector('#gateList');

    const steps = {
      preview: document.querySelector('#previewStep'),
      stop: document.querySelector('#stopStep'),
      boundary: document.querySelector('#boundaryStep'),
      gate: document.querySelector('#gateStep'),
      run: document.querySelector('#runStep')
    };

    const colours = ['#24b576', '#2987d8', '#f0a326', '#a55eea'];
    let processingStarted = false,
      roadModelEnabled = false,
      reloadInProgress = false;

    async function updateReloadAvailability() {
      try {
        const response = await fetch('/api/status', { cache: 'no-store' });
        if (!response.ok) throw Error('無法讀取 Stage-5 狀態');
        const data = await response.json();
        processingStarted = data.processing_started;
        roadModelEnabled = data.road_markings.enabled;
        const devices = data.devices;
        deviceStatus.hidden = !processingStarted || !devices;
        if (processingStarted && devices) {
          const yoloDevice = String(devices.yolo || 'unknown').toUpperCase();
          const stage5Device = devices.stage5
            ? `${String(devices.stage5).toUpperCase()}（Reload 時）`
            : '停用';
          deviceStatus.textContent = `裝置：YOLO ${yoloDevice}｜Stage-5 ${stage5Device}`;
          deviceStatus.title = '顯示後端實際選定的推論裝置；Stage-5 只在 Reload LaneNet 時載入';
        }
        const scale = data.speed_scale || data.visual_scale;
        visualScaleStatus.hidden = !processingStarted || !scale;
        if (processingStarted && scale) {
          visualScaleStatus.title = scale.method === 'gate_distance'
            ? '以使用者標示的相鄰一般 Gate 距離 10 m 為基準；現地距離尚未量測驗證'
            : '使用車種尺寸先驗估算，尚未與實測車速比對';
          visualScaleStatus.textContent = scale.method === 'gate_distance'
            ? '測速基準：相鄰一般 Gate 10 m（現地距離假設）'
            : scale.state === 'ready'
              ? `畫面測速：${scale.quality === 'MED' ? '中' : '低'}可信（${scale.vehicles} 台車，尺寸先驗）`
              : `畫面測速：尺度仍用先驗（已取得 ${scale.vehicles} 台車）`;
        }
        const laneChanges = data.lane_changes;
        laneChangeStatus.hidden = !processingStarted || !laneChanges;
        if (processingStarted && laneChanges) {
          laneChangeStatus.textContent = laneChanges.enabled
            ? `變道：${laneChanges.total}（左 ${laneChanges.left}｜右 ${laneChanges.right}）`
            : `變道：${laneChanges.message}`;
          laneChangeStatus.title = laneChanges.enabled
            ? `已沿左右彎曲邊界等距建立 ${laneChanges.separator_count} 條內部分隔線`
            : '缺少左右道路邊界或 Gate 幾何無效時不進行變道判定';
        }
        reloadButton.disabled = !processingStarted || !roadModelEnabled ||
          reloadInProgress || data.road_markings.state === 'loading';
      } catch (error) {
        roadModelEnabled = false;
        deviceStatus.hidden = true;
        laneChangeStatus.hidden = true;
        console.error(error);
        reloadButton.disabled = true;
      }
    }

    updateReloadAvailability();
    setInterval(updateReloadAvailability, 2000);

    function selectedDetectionMode() {
      return detectionModeSwitch.checked ? 'entering' : 'leaving';
    }

    function refreshDetectionModeText() {
      detectionModeText.textContent = detectionModeSwitch.checked ? '入鏡頭' : '離鏡頭';
    }

    detectionModeSwitch.onchange = () => {
      refreshDetectionModeText();
      const mode = detectionModeText.textContent;
      status.textContent = processingStarted
        ? `主要偵測已選擇「${mode}」；按重新判斷後套用。`
        : `主要偵測已切換為「${mode}」。`;
    };

    const finishBoundaryButton = document.querySelector('#finishBoundary'),
      fractionalGateButton = document.querySelector('#fractionalGate'),
      exportButton = document.querySelector('#exportGeometry'),
      importButton = document.querySelector('#importGeometry'),
      importFile = document.querySelector('#importFile'),
      instruction = document.querySelector('#instruction');
    const MIN_REGULAR_GATES = 5;
    let stopLine = null,
      boundaries = { L: null, R: null },
      boundaryDraft = [],
      gates = [],
      selectedGateIndex = -1,
      nextFractional = false,
      undoStack = [],
      redoStack = [],
      pointerAction = null,
      stopAnchor = null,
      hoverPoint = null,
      drawing = true,
      colourIndex = 0;

    function resize() {
      canvas.width = image.clientWidth;
      canvas.height = image.clientHeight;
      paintAll();
    }

    image.onload = () => {
      resize();
      if (!processingStarted) {
        refresh();
        status.textContent = '請點一下停止線 L 錨點，再點一下 R 錨點。';
      }
    };

    image.onerror = () => {
      status.textContent = '❌ 第一幀載入失敗，請確認主程式與影片檔。';
    };

    image.src = '/first_frame.jpg?' + Date.now();
    addEventListener('resize', resize);

    function normal(event) {
      const r = canvas.getBoundingClientRect();
      return {
        x: Number(Math.max(0, Math.min(1, (event.clientX - r.left) / r.width)).toFixed(5)),
        y: Number(Math.max(0, Math.min(1, (event.clientY - r.top) / r.height)).toFixed(5))
      };
    }

    function sourcePoint(p) {
      return { x: p.x * image.naturalWidth, y: p.y * image.naturalHeight };
    }

    function normalizedPoint(p) {
      return {
        x: Number((p.x / image.naturalWidth).toFixed(5)),
        y: Number((p.y / image.naturalHeight).toFixed(5))
      };
    }

    function onScreen(p) {
      return {
        x: p.x * canvas.width,
        y: p.y * canvas.height
      };
    }

    function paint(line, color, label) {
      if (!line) return;
      const a = onScreen(line.L),
        b = onScreen(line.R);
      ctx.strokeStyle = color;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
      ctx.fillStyle = color;
      ctx.font = 'bold 14px system-ui';
      ctx.fillText(label, a.x + 7, a.y - 8);
    }

    function paintPath(points, color, label) {
      if (!points || !points.length) return;
      const first = onScreen(points[0]);
      ctx.strokeStyle = color;
      ctx.lineWidth = 1;
      ctx.setLineDash([8, 5]);
      ctx.beginPath();
      ctx.moveTo(first.x, first.y);
      points.slice(1).forEach(p => {
        const q = onScreen(p);
        ctx.lineTo(q.x, q.y);
      });
      ctx.stroke();
      ctx.setLineDash([]);
      points.forEach(p => {
        const q = onScreen(p);
        ctx.beginPath();
        ctx.arc(q.x, q.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
      });
      ctx.fillStyle = color;
      ctx.font = 'bold 14px system-ui';
      ctx.fillText(label, first.x + 7, first.y + 18);
    }

    function cross(a, b) { return a.x * b.y - a.y * b.x; }

    function boundaryIntersection(anchor, axis, points, expectedSign) {
      if (!points) return null;
      const p = sourcePoint(anchor);
      let closest = null;
      for (let i = 1; i < points.length; i++) {
        const a = sourcePoint(points[i - 1]), b = sourcePoint(points[i]);
        const segment = { x: b.x - a.x, y: b.y - a.y };
        const denominator = cross(axis, segment);
        if (Math.abs(denominator) < 1e-8) continue;
        const offset = { x: a.x - p.x, y: a.y - p.y };
        const distance = cross(offset, segment) / denominator;
        const part = cross(offset, axis) / denominator;
        if (part < -1e-6 || part > 1 + 1e-6 || distance * expectedSign < 2) continue;
        if (!closest || Math.abs(distance) < Math.abs(closest.distance)) {
          closest = { distance, point: normalizedPoint({
            x: p.x + distance * axis.x, y: p.y + distance * axis.y
          }) };
        }
      }
      return closest;
    }

    function resolveGate(anchor, angleDeg, roadBoundaries = boundaries) {
      const angle = angleDeg * Math.PI / 180;
      const axis = { x: Math.cos(angle), y: Math.sin(angle) };
      const left = boundaryIntersection(anchor, axis, roadBoundaries.L, -1);
      const right = boundaryIntersection(anchor, axis, roadBoundaries.R, 1);
      return left && right ? { L: left.point, R: right.point } : null;
    }

    function gateHandle(gate) {
      const anchor = sourcePoint(gate.anchor);
      const right = gate.line ? sourcePoint(gate.line.R) : null;
      const reach = right ? Math.hypot(right.x - anchor.x, right.y - anchor.y) : 80;
      const length = Math.max(90, Math.min(150, reach * 0.7));
      const angle = gate.angle_deg * Math.PI / 180;
      return normalizedPoint({
        x: anchor.x + Math.cos(angle) * length,
        y: anchor.y + Math.sin(angle) * length
      });
    }

    function paintGate(gate, index) {
      if (gate.line) {
        paint(gate.line, gate.color, `${gate.gate}｜${gate.lane} 車道`);
      } else {
        const anchor = onScreen(gate.anchor), angle = gate.angle_deg * Math.PI / 180;
        const scale = canvas.width / image.naturalWidth;
        ctx.strokeStyle = '#e75050';
        ctx.lineWidth = 1;
        ctx.setLineDash([6, 5]);
        ctx.beginPath();
        ctx.moveTo(anchor.x - 90 * Math.cos(angle) * scale, anchor.y - 90 * Math.sin(angle) * scale);
        ctx.lineTo(anchor.x + 90 * Math.cos(angle) * scale, anchor.y + 90 * Math.sin(angle) * scale);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = '#e75050';
        ctx.fillText(`${gate.gate}：未接到兩側邊界`, anchor.x + 7, anchor.y - 8);
      }
      if (index === selectedGateIndex) {
        const anchor = onScreen(gate.anchor), handle = onScreen(gateHandle(gate));
        ctx.strokeStyle = gate.color;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(anchor.x, anchor.y);
        ctx.lineTo(handle.x, handle.y);
        ctx.stroke();
        for (const [point, radius] of [[anchor, 6], [handle, 9]]) {
          ctx.beginPath();
          ctx.arc(point.x, point.y, radius, 0, Math.PI * 2);
          ctx.fillStyle = '#fff';
          ctx.fill();
          ctx.stroke();
        }
      }
    }

    function paintAll() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      paint(stopLine, '#e75050', '停止線');
      paintPath(boundaries.L, '#24b5c9', 'L 邊界');
      paintPath(boundaries.R, '#edb42c', 'R 邊界');
      const phase = currentPhase();
      if ((boundaryDraft.length || hoverPoint) && (phase === 'left' || phase === 'right')) {
        const side = phase === 'left' ? 'L' : 'R';
        paintPath([stopLine[side], ...boundaryDraft, ...(hoverPoint ? [hoverPoint] : [])],
          side === 'L' ? '#24b5c9' : '#edb42c', `${side} 邊界預覽`);
      }
      gates.forEach(paintGate);
      if (stopAnchor && hoverPoint) {
        paint({ L: stopAnchor, R: hoverPoint }, '#e75050', '停止線預覽');
      }
    }

    function currentPhase() {
      if (!stopLine) return 'stop';
      if (!boundaries.L) return 'left';
      if (!boundaries.R) return 'right';
      return 'gate';
    }

    function snapshot() {
      return JSON.parse(JSON.stringify({
        stopLine, boundaries, boundaryDraft, gates, selectedGateIndex, nextFractional,
        laneCount: Number(defaultLaneInput.value), detectionMode: selectedDetectionMode()
      }));
    }

    function restore(state) {
      ({ stopLine, boundaries, boundaryDraft, gates, selectedGateIndex, nextFractional } = state);
      stopAnchor = hoverPoint = null;
      defaultLaneInput.value = state.laneCount;
      detectionModeSwitch.checked = state.detectionMode === 'entering';
      refreshDetectionModeText();
      refresh();
    }

    function recordChange() {
      undoStack.push(snapshot());
      redoStack = [];
    }

    function regularGateCount() {
      return gates.filter(g => !g.gate.endsWith('.4')).length;
    }

    function readyToStart() {
      return currentPhase() === 'gate' && regularGateCount() >= MIN_REGULAR_GATES &&
        gates.every(g => g.line !== null);
    }

    function progress(active) {
      const names = ['preview', 'stop', 'boundary', 'gate', 'run'],
        at = names.indexOf(active);
      names.forEach((name, i) => {
        steps[name].className = `step ${i < at ? 'done' : i === at ? 'active' : ''}`;
      });
    }

    function refresh() {
      const phase = currentPhase();
      progress(processingStarted ? 'run' : phase === 'stop' ? 'stop' :
        phase === 'gate' && readyToStart() ? 'run' : phase === 'gate' ? 'gate' : 'boundary');
      defaultLaneInput.disabled = !stopLine;
      undoButton.disabled = !undoStack.length;
      redoButton.disabled = !redoStack.length;
      startButton.disabled = !readyToStart() || processingStarted;
      finishBoundaryButton.disabled = !drawing || !['left', 'right'].includes(phase) || !boundaryDraft.length;
      fractionalGateButton.disabled = !drawing || phase !== 'gate' || !gates.length ||
        gates[gates.length - 1].gate.endsWith('.4');
      fractionalGateButton.textContent = nextFractional ? '下一條：.4 Gate ✓' : '下一條為 .4 Gate';
      exportButton.disabled = !readyToStart();
      colourButton.style.background = colours[colourIndex];
      drawButton.classList.toggle('active', drawing);
      gateList.innerHTML = gates.length
        ? gates.map((g, i) => `<button type="button" class="gate-row" data-index="${i}"><span>${g.gate}</span> ${g.line ? `${g.angle_deg.toFixed(1)}°` : '⚠ 邊界未相交'}</button>`).join('')
        : '<span>尚未設定 Gate</span>';
      instruction.textContent = phase === 'stop'
        ? '先點停止線 L 錨點，再點 R 錨點；線段會跟隨滑鼠預覽。停止線須跨越所有要校正的車道。'
        : phase === 'left' || phase === 'right'
          ? `從停止線 ${phase === 'left' ? 'L' : 'R'} 端沿道路邊界逐點點擊；線段會跟隨滑鼠，按 Enter 完成此邊界。`
          : '點選白色虛線頂端建立 Gate；選取 Gate 後拖曳圓形把手調整角度，線段會自動接到左右邊界。至少需要 5 個一般 Gate。';
      paintAll();
    }

    function validLaneCount() {
      const count = Number(defaultLaneInput.value);
      return Number.isInteger(count) && count >= 1 ? count : null;
    }

    function distanceInSource(a, b) {
      const p = sourcePoint(a), q = sourcePoint(b);
      return Math.hypot(p.x - q.x, p.y - q.y);
    }

    function nextGateData() {
      const last = gates[gates.length - 1];
      const previousNumber = last ? Number(last.gate.match(/Gate (\d+)/)[1]) : 0;
      const number = nextFractional ? previousNumber : previousNumber + 1;
      return {
        gate: `Gate ${number}${nextFractional ? '.4' : ''}`,
        station_m: (number - 1) * 10 + (nextFractional ? 4 : 0)
      };
    }

    function addGate(anchor) {
      const lane = validLaneCount();
      if (!lane) {
        status.textContent = '❌ 請先填寫有效的預設車道數。';
        defaultLaneInput.focus();
        return;
      }
      const last = gates[gates.length - 1];
      const angle_deg = last ? last.angle_deg : Math.atan2(
        (stopLine.R.y - stopLine.L.y) * image.naturalHeight,
        (stopLine.R.x - stopLine.L.x) * image.naturalWidth
      ) * 180 / Math.PI;
      const line = resolveGate(anchor, angle_deg);
      recordChange();
      gates.push({ ...nextGateData(), anchor, angle_deg, line,
        lane, color: colours[colourIndex] });
      selectedGateIndex = gates.length - 1;
      nextFractional = false;
      status.textContent = line
        ? `✅ ${gates[selectedGateIndex].gate} 已建立。拖曳圓形把手可調整角度。`
        : '⚠ Gate 尚未與兩側邊界相交；請拖曳圓形把手調整角度或重畫邊界。';
      refresh();
    }

    function nearbyGateIndex(point, getPosition) {
      const screen = onScreen(point);
      for (let i = gates.length - 1; i >= 0; i--) {
        const candidate = onScreen(getPosition(gates[i]));
        if (Math.hypot(screen.x - candidate.x, screen.y - candidate.y) <= 13) return i;
      }
      return -1;
    }

    function updateRotation(index, point) {
      const gate = gates[index], a = sourcePoint(gate.anchor), p = sourcePoint(point);
      if (Math.hypot(p.x - a.x, p.y - a.y) < 8) return;
      gate.angle_deg = Math.atan2(p.y - a.y, p.x - a.x) * 180 / Math.PI;
      gate.line = resolveGate(gate.anchor, gate.angle_deg);
      paintAll();
    }

    canvas.onpointerdown = e => {
      if (e.button !== 0 || !drawing || !image.naturalWidth) return;
      canvas.focus();
      const point = normal(e), phase = currentPhase();
      if (phase === 'stop') {
        pointerAction = { kind: 'stop-click' };
      } else if (phase === 'gate') {
        const handleIndex = nearbyGateIndex(point, gateHandle);
        if (handleIndex >= 0 && handleIndex === selectedGateIndex) {
          pointerAction = { kind: 'rotate', index: handleIndex, before: snapshot() };
        } else {
          const anchorIndex = nearbyGateIndex(point, gate => gate.anchor);
          if (anchorIndex >= 0) {
            selectedGateIndex = anchorIndex;
            status.textContent = `${gates[anchorIndex].gate} 已選取；拖曳圓形把手調整角度。`;
            refresh();
            return;
          }
          pointerAction = { kind: 'place' };
        }
      } else {
        pointerAction = { kind: 'boundary' };
      }
      canvas.setPointerCapture(e.pointerId);
      e.preventDefault();
    };

    canvas.onpointermove = e => {
      if (!pointerAction || pointerAction.kind !== 'rotate') {
        if (stopAnchor || ['left', 'right'].includes(currentPhase())) {
          hoverPoint = normal(e);
          paintAll();
        }
      } else {
        updateRotation(pointerAction.index, normal(e));
      }
    };

    canvas.onpointerup = e => {
      if (!pointerAction) return;
      const action = pointerAction, point = normal(e);
      pointerAction = null;
      if (canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
      if (action.kind === 'stop-click') {
        if (!stopAnchor) {
          stopAnchor = point;
          hoverPoint = point;
          status.textContent = '已固定 L 錨點；移動滑鼠預覽，點一下設定 R 錨點。';
        } else if (distanceInSource(stopAnchor, point) < 15) {
          status.textContent = '❌ 停止線太短，請點更遠的 R 錨點。';
        } else {
          recordChange();
          stopLine = { L: stopAnchor, R: point };
          stopAnchor = hoverPoint = null;
          status.textContent = '✅ 停止線完成；請從 L 端沿道路點選左邊界。';
        }
      } else if (action.kind === 'boundary') {
        const side = currentPhase() === 'left' ? 'L' : 'R';
        const previous = boundaryDraft.at(-1) || stopLine[side];
        if (distanceInSource(previous, point) >= 5) {
          recordChange();
          boundaryDraft.push(point);
          status.textContent = `已加入 ${side} 邊界點；移動滑鼠預覽下一段，按 Enter 完成。`;
        }
      } else if (action.kind === 'place') {
        addGate(point);
      } else if (action.kind === 'rotate') {
        updateRotation(action.index, point);
        if (Math.abs(gates[action.index].angle_deg - action.before.gates[action.index].angle_deg) > 0.01) {
          undoStack.push(action.before);
          redoStack = [];
          status.textContent = gates[action.index].line
            ? `✅ ${gates[action.index].gate} 角度已調整。`
            : '⚠ Gate 尚未與兩側邊界相交，請繼續調整角度。';
        }
      }
      refresh();
    };

    canvas.onpointercancel = () => {
      if (pointerAction?.kind === 'rotate') restore(pointerAction.before);
      pointerAction = null;
      refresh();
    };

    canvas.onpointerleave = () => {
      if (pointerAction?.kind === 'rotate') return;
      hoverPoint = null;
      paintAll();
    };

    finishBoundaryButton.onclick = () => {
      const phase = currentPhase();
      if (!['left', 'right'].includes(phase) || !boundaryDraft.length) return;
      const side = phase === 'left' ? 'L' : 'R';
      if (distanceInSource(stopLine[side], boundaryDraft[0]) < 15) {
        status.textContent = '❌ 邊界太短，請沿道路加入更遠的點。';
        return;
      }
      recordChange();
      boundaries[side] = [stopLine[side], ...boundaryDraft];
      boundaryDraft = [];
      hoverPoint = null;
      status.textContent = side === 'L'
        ? '✅ 左邊界完成；請從 R 端沿道路點選右邊界。'
        : '✅ 兩側邊界完成；請點白色虛線頂端建立 Gate 1。';
      refresh();
    };

    window.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        stopAnchor = hoverPoint = null;
        paintAll();
      }
      if (e.key === 'Enter' && e.target?.tagName !== 'INPUT' &&
          !finishBoundaryButton.disabled) {
        e.preventDefault();
        finishBoundaryButton.onclick();
      }
    });

    fractionalGateButton.onclick = () => {
      if (fractionalGateButton.disabled) return;
      recordChange();
      nextFractional = !nextFractional;
      status.textContent = nextFractional ? '下一次點擊會新增選配的 .4 Gate。' : '下一次點擊會新增一般 Gate。';
      refresh();
    };

    gateList.onclick = e => {
      const row = e.target.closest('[data-index]');
      if (!row) return;
      selectedGateIndex = Number(row.dataset.index);
      status.textContent = `${gates[selectedGateIndex].gate} 已選取；拖曳圓形把手調整角度。`;
      refresh();
    };

    defaultLaneInput.onchange = () => {
      const lane = validLaneCount();
      if (!lane) {
        status.textContent = '❌ 車道數須為正整數。';
        return;
      }
      if (gates.some(g => g.lane !== lane)) {
        recordChange();
        gates.forEach(g => { g.lane = lane; });
      }
      status.textContent = `整條道路設定為 ${lane} 車道。`;
      refresh();
    };

    drawButton.onclick = () => {
      drawing = !drawing;
      status.textContent = drawing ? '校正繪製已啟用。' : '校正繪製已暫停。';
      refresh();
    };

    undoButton.onclick = () => {
      if (!undoStack.length) return;
      redoStack.push(snapshot());
      restore(undoStack.pop());
      status.textContent = '已回到上一步。';
    };

    redoButton.onclick = () => {
      if (!redoStack.length) return;
      undoStack.push(snapshot());
      restore(redoStack.pop());
      status.textContent = '已重做。';
    };

    colourButton.onclick = () => {
      colourIndex = (colourIndex + 1) % colours.length;
      status.textContent = '已切換下一條 Gate 的顏色。';
      refresh();
    };

    function geometryDocument() {
      return {
        schema_version: 3,
        video: {
          coordinate_system: 'normalized_0_to_1',
          width: image.naturalWidth,
          height: image.naturalHeight
        },
        lane_count: validLaneCount(),
        detection_mode: selectedDetectionMode(),
        stop_line: { line: stopLine },
        road_boundaries: boundaries,
        gates: gates.map(({ color, line, ...gate }) => ({
          ...gate, angle_deg: Number(gate.angle_deg.toFixed(3))
        }))
      };
    }

    function savePayload() {
      return {
        schema_version: 3,
        lane_count: validLaneCount(),
        detection_mode: selectedDetectionMode(),
        road_boundaries: boundaries,
        stop_line: { line: stopLine },
        gates: gates.map(({ gate, lane, station_m, anchor, angle_deg, line }) => ({
          gate, lane, station_m, anchor, angle_deg, line
        }))
      };
    }

    exportButton.onclick = () => {
      if (!readyToStart()) return;
      const blob = new Blob([JSON.stringify(geometryDocument(), null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'gate_geometry.json';
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      status.textContent = '✅ 已匯出完整校正 JSON；請妥善對應原始影片。';
    };

    function checkPoint(point) {
      if (!point || !Number.isFinite(point.x) || !Number.isFinite(point.y) ||
          point.x < 0 || point.x > 1 || point.y < 0 || point.y > 1) {
        throw Error('座標必須是 0～1 的正規化位置');
      }
      return { x: point.x, y: point.y };
    }

    function loadGeometry(data) {
      if (data.schema_version !== 3 || data.video?.coordinate_system !== 'normalized_0_to_1') {
        throw Error('請選擇本頁匯出的版本 3 校正 JSON');
      }
      if (data.video.width !== image.naturalWidth || data.video.height !== image.naturalHeight) {
        throw Error('JSON 的原始影像尺寸與目前影片不同');
      }
      const line = { L: checkPoint(data.stop_line?.line?.L), R: checkPoint(data.stop_line?.line?.R) };
      if (distanceInSource(line.L, line.R) < 15) throw Error('停止線太短');
      const count = Number(data.lane_count);
      if (!Number.isInteger(count) || count < 1) throw Error('車道數須為正整數');
      const detectionMode = data.detection_mode || 'leaving';
      if (!['entering', 'leaving'].includes(detectionMode)) {
        throw Error('主要偵測模式無效');
      }
      const importedBoundaries = {};
      for (const side of ['L', 'R']) {
        const points = data.road_boundaries?.[side];
        if (!Array.isArray(points) || points.length < 2) throw Error(`${side} 邊界至少需要兩個點`);
        importedBoundaries[side] = points.map(checkPoint);
        if (distanceInSource(importedBoundaries[side][0], line[side]) > 2) {
          throw Error(`${side} 邊界必須從停止線端點開始`);
        }
      }
      if (!Array.isArray(data.gates) || data.gates.length < MIN_REGULAR_GATES) {
        throw Error('JSON 至少需要五條 Gate');
      }
      const importedGates = data.gates.map((gate, index) => {
        if (!/^Gate [1-9]\d*(?:\.4)?$/.test(gate.gate)) throw Error('Gate 名稱格式錯誤');
        const anchor = checkPoint(gate.anchor);
        const angle_deg = Number(gate.angle_deg);
        const station_m = Number(gate.station_m);
        if (!Number.isFinite(angle_deg) || !Number.isFinite(station_m)) {
          throw Error('Gate 角度或里程無效');
        }
        const resolved = resolveGate(anchor, angle_deg, importedBoundaries);
        if (!resolved) throw Error(`${gate.gate} 未與兩側邊界相交`);
        return { gate: gate.gate, lane: count, station_m,
          anchor, angle_deg, line: resolved, color: colours[index % colours.length] };
      });
      if (importedGates.filter(g => !g.gate.endsWith('.4')).length < MIN_REGULAR_GATES ||
          importedGates.some((g, i) => i && g.station_m <= importedGates[i - 1].station_m)) {
        throw Error('Gate 數量或里程順序無效');
      }
      recordChange();
      stopLine = line;
      boundaries = importedBoundaries;
      boundaryDraft = [];
      stopAnchor = hoverPoint = null;
      gates = importedGates;
      selectedGateIndex = -1;
      nextFractional = false;
      defaultLaneInput.value = count;
      detectionModeSwitch.checked = detectionMode === 'entering';
      refreshDetectionModeText();
      status.textContent = `✅ 已匯入 ${importedGates.length} 條 Gate；請確認畫面與原始影片相符。`;
      refresh();
    }

    importButton.onclick = () => importFile.click();
    importFile.onchange = async () => {
      const file = importFile.files?.[0];
      if (!file) return;
      try {
        loadGeometry(JSON.parse(await file.text()));
      } catch (error) {
        status.textContent = '❌ 匯入失敗：' + error.message;
      } finally {
        importFile.value = '';
      }
    };

    async function request(url) {
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: url === '/save_points' ? JSON.stringify(savePayload()) : undefined
      });
      const data = await response.json();
      if (!response.ok) throw Error(data.detail);
      return data;
    }
    const resetBtn = document.querySelector('#resetBtn');
    
    startButton.onclick = async () => {
      try {
        if (!readyToStart()) throw Error('請先完成至少五條一般 Gate，並確認每條 Gate 都接到兩側邊界');
        await request('/save_points');
        await request('/start_processing');
        processingStarted = true;
        image.src = '/video_feed?' + Date.now();
        progress('run');
        status.textContent = '✅ 判斷已開始。';
        await updateReloadAvailability();
        
        // 開始後，隱藏開始按鈕，顯示重新判斷按鈕
        startButton.style.display = 'none';
        resetBtn.style.display = 'block';
      } catch (error) {
        status.textContent = '❌ ' + error.message;
      }
    };

    resetBtn.onclick = async () => {
      try {
        status.textContent = '⏳ 正在停止並重置模型，請稍候...';
        
        // 1. 呼叫後端重置，中斷目前的影片處理
        await request('/api/reset');
        
        // 2. 確保剛才畫的線（包含預覽等）再次被儲存
        await request('/save_points');
        
        // 3. 重新觸發開始處理
        await request('/start_processing');
        
        // 4. 強制刷新圖片網址以解凍畫面
        processingStarted = true;
        image.src = '/video_feed?' + Date.now();
        status.textContent = '✅ 已重新開始判斷。';
        await updateReloadAvailability();
      } catch (error) {
        status.textContent = '❌ 重置失敗: ' + error.message;
      }
    };

    reloadButton.onclick = async () => {
      reloadInProgress = true;
      reloadButton.disabled = true;
      status.textContent = '⏳ 正在重新載入 Stage-5 並偵測目前畫面的標線…';
      try {
        await request('/api/reload_lanenet');
        while (true) {
          await new Promise(resolve => setTimeout(resolve, 500));
          const response = await fetch('/api/status', { cache: 'no-store' });
          if (!response.ok) throw Error('無法讀取 Stage-5 狀態');
          const data = await response.json();
          const road = data.road_markings;
          if (road.state === 'ready') {
            status.textContent = '✅ ' + road.message;
            break;
          }
          if (road.state === 'error' || road.state === 'disabled') {
            throw Error(road.message);
          }
        }
      } catch (error) {
        status.textContent = '❌ ' + error.message;
      } finally {
        reloadInProgress = false;
        await updateReloadAvailability();
      }
    };

    refresh();
  </script>
</body>
</html>
