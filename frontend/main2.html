<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>道路 Gate 校正</title>
<style>
:root{
  --orange:#ff8a3d;
  --orange-2:#ff6f3c;
  --orange-soft:#ffb37a;
  --orange-tint:#fff1e6;
  --orange-tint-2:#ffe1c6;
  --ink:#3a2c22;
  --ink-soft:#9c8a7d;
  --glass:rgba(255,255,255,.6);
  --glass-strong:rgba(255,255,255,.82);
  --glass-border:rgba(255,255,255,.85);
  --radius-xl:30px;
  --radius-lg:22px;
  --radius-md:16px;
  --radius-sm:11px;
  --radius-pill:999px;
  --shadow-card:0 24px 60px -26px rgba(255,111,60,.4),0 10px 26px -14px rgba(58,44,34,.16);
  --shadow-soft:0 10px 24px -12px rgba(58,44,34,.16);
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{
  margin:0;min-height:100vh;padding:36px 20px;
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro TC","PingFang TC","Microsoft JhengHei","Helvetica Neue",Arial,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(640px 420px at 6% -10%,#ffd9ac 0%,transparent 60%),
    radial-gradient(560px 480px at 108% 6%,#ffe7cc 0%,transparent 55%),
    radial-gradient(900px 640px at 50% 118%,#ffdfc0 0%,transparent 58%),
    linear-gradient(180deg,#fbf8f4,#f6efe7 55%,#f8efe4);
  background-attachment:fixed;
}
.page{max-width:1180px;margin:0 auto}
.brand{align-items:center;display:flex;gap:14px;margin:4px 6px 20px;padding:2px}
.brand-icon{align-items:center;background:linear-gradient(135deg,var(--orange-tint),var(--orange-tint-2));border-radius:16px;color:var(--orange-2);display:flex;flex:none;height:46px;justify-content:center;width:46px}
.brand-icon svg{height:24px;width:24px}
.brand-text h1{color:var(--ink);font-size:19px;font-weight:800;letter-spacing:-.01em;margin:0}
.brand-text p{color:var(--ink-soft);font-size:12.5px;font-weight:600;margin:3px 0 0}
.app{background:var(--glass);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--glass-border);border-radius:var(--radius-xl);box-shadow:var(--shadow-card),inset 0 1px 0 rgba(255,255,255,.6);display:grid;gap:18px;grid-template-columns:minmax(560px,1fr) 92px;padding:26px}
.steps{background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.7);border-radius:var(--radius-pill);display:flex;gap:6px;margin-bottom:18px;padding:6px}
.step{align-items:center;border-radius:var(--radius-pill);color:var(--ink-soft);display:flex;flex:1;font-weight:700;font-size:12.5px;gap:6px;justify-content:center;padding:10px 8px;transition:background .4s var(--ease),color .3s var(--ease),box-shadow .3s var(--ease);white-space:nowrap}
.step .step-icon{display:flex;flex:none;height:16px;width:16px}
.step .step-icon svg{height:100%;width:100%}
.step.active{background:linear-gradient(135deg,var(--orange),var(--orange-2));box-shadow:0 8px 18px -8px rgba(255,111,60,.6);color:#fff}
.step.done{background:var(--orange-tint-2);color:var(--orange-2)}
.stage{background:linear-gradient(160deg,#1d1a17,#0d0c0a 72%);border:1px solid rgba(255,255,255,.07);border-radius:var(--radius-lg);box-shadow:inset 0 0 0 1px rgba(255,255,255,.04),0 18px 36px -20px rgba(0,0,0,.55);display:grid;min-height:560px;overflow:hidden;place-items:center}
.wrap{border-radius:var(--radius-md);max-height:560px;max-width:100%;overflow:hidden;position:relative}
.wrap img{display:block;max-height:560px;max-width:100%}
.wrap canvas{cursor:crosshair;height:100%;inset:0;position:absolute;width:100%}
.bottom{align-items:center;background:var(--glass-strong);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid rgba(255,255,255,.8);border-radius:var(--radius-pill);box-shadow:var(--shadow-soft);display:flex;gap:14px;margin-top:16px;padding:11px 10px 11px 20px}
.status{color:var(--ink);flex:1;font-size:13px;font-weight:600}
.lane-default{align-items:center;color:var(--ink-soft);display:flex;font-weight:700;font-size:12.5px;gap:8px;white-space:nowrap}
.lane-default input,.gate-row input{background:#fff;border:1.5px solid var(--orange-tint-2);border-radius:var(--radius-sm);color:var(--ink);font:inherit;font-weight:700;padding:8px 6px;text-align:center;transition:border-color .25s var(--ease),box-shadow .25s var(--ease);width:54px}
.lane-default input:focus,.gate-row input:focus{border-color:var(--orange);box-shadow:0 0 0 4px rgba(255,138,61,.18);outline:none}
.start{align-items:center;background:linear-gradient(135deg,var(--orange),var(--orange-2));border:0;border-radius:var(--radius-pill);color:#fff;cursor:pointer;display:flex;font-weight:800;font-size:13.5px;gap:8px;padding:12px 22px;box-shadow:0 12px 26px -10px rgba(255,111,60,.55);transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.start svg{height:14px;width:14px}
.start:hover:not(:disabled){box-shadow:0 16px 30px -10px rgba(255,111,60,.65);transform:translateY(-2px)}
.start:active:not(:disabled){transform:translateY(0) scale(.96)}
.start:disabled{background:#e9e0d8;box-shadow:none;color:#b7ab9f;cursor:not-allowed}
.gate-panel{background:var(--glass);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid rgba(255,255,255,.8);border-radius:var(--radius-lg);box-shadow:var(--shadow-soft);margin-top:14px;padding:14px 16px}
.gate-panel h3{color:var(--ink-soft);font-size:12.5px;font-weight:800;margin:0 0 9px}
.gate-list{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-color:var(--orange-soft) transparent;scrollbar-width:thin}
.gate-list::-webkit-scrollbar{height:6px}
.gate-list::-webkit-scrollbar-thumb{background:var(--orange-soft);border-radius:99px}
.gate-list::-webkit-scrollbar-track{background:transparent}
.gate-list>span{color:var(--ink-soft);font-size:13px;font-weight:600;padding:8px 4px}
@keyframes popIn{from{opacity:0;transform:translateY(6px) scale(.92)}to{opacity:1;transform:translateY(0) scale(1)}}
.gate-row{align-items:center;animation:popIn .4s var(--ease);background:#fff;border:1px solid #ffe4cc;border-radius:var(--radius-pill);display:flex;gap:8px;padding:7px 12px 7px 6px;transition:box-shadow .25s var(--ease),transform .2s var(--ease);white-space:nowrap}
.gate-row:hover{box-shadow:0 8px 18px -10px rgba(255,138,61,.35);transform:translateY(-1px)}
.gate-row span{background:linear-gradient(135deg,var(--orange),var(--orange-2));border-radius:var(--radius-pill);color:#fff;font-size:11.5px;font-weight:800;padding:6px 11px}
.tools{align-items:center;align-self:start;background:var(--glass-strong);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.85);border-radius:var(--radius-xl);box-shadow:var(--shadow-card);display:flex;flex-direction:column;gap:10px;padding:14px 10px;position:sticky;top:20px}
.tool{align-items:center;background:var(--orange-tint);border:0;border-radius:50%;color:var(--orange-2);cursor:pointer;display:flex;height:44px;justify-content:center;transition:transform .2s var(--ease),background .25s var(--ease),color .25s var(--ease),box-shadow .25s var(--ease);width:44px}
.tool svg{height:18px;width:18px}
.tool:hover:not(:disabled){box-shadow:0 10px 20px -10px rgba(255,138,61,.5);transform:translateY(-2px) scale(1.05)}
.tool:active:not(:disabled){transform:scale(.94)}
.tool.active{background:linear-gradient(135deg,var(--orange),var(--orange-2));box-shadow:0 10px 22px -8px rgba(255,111,60,.6);color:#fff}
.tool:disabled{box-shadow:none;cursor:not-allowed;opacity:.35;transform:none}
button:focus-visible{outline:3px solid rgba(255,138,61,.55);outline-offset:2px}
.divider{background:rgba(58,44,34,.1);height:1px;margin:2px 0;width:26px}
.swatch{border:3px solid #fff;box-shadow:0 0 0 1.5px #ffd6a5,0 8px 16px -8px rgba(0,0,0,.25);padding:0}
.tip{color:var(--ink-soft);font-size:12px;line-height:1.6;margin:14px 4px 0;text-align:center}
@media(max-width:760px){
  body{padding:16px 12px}
  .brand{margin:2px 4px 14px}
  .brand-text p{display:none}
  .app{border-radius:22px;gap:12px;grid-template-columns:1fr 66px;padding:16px}
  .steps{padding:4px}
  .step{padding:10px 4px}
  .step .step-label{display:none}
  .stage{border-radius:16px;min-height:380px}
  .wrap,.wrap img{max-height:380px}
  .bottom{align-items:stretch;border-radius:20px;flex-direction:column;padding:14px}
  .lane-default{justify-content:space-between}
  .start{justify-content:center}
  .tools{border-radius:20px;padding:10px 6px;position:static}
  .tool{height:40px;width:40px}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>
<div class="page">
<header class="brand">
<span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 3L4 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M16 3L20 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 4V7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 10.5V13.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 17V20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>
<div class="brand-text"><h1>道路 Gate 校正</h1><p>拖曳畫出停止線與 Gate，設定完成即可開始 AI 判斷</p></div>
</header>
<div class="app"><main><nav class="steps">
<span class="step active" id="previewStep"><span class="step-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2.5 12C4.5 7.5 8 5 12 5C16 5 19.5 7.5 21.5 12C19.5 16.5 16 19 12 19C8 19 4.5 16.5 2.5 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.6" stroke="currentColor" stroke-width="1.8"/></svg></span><span class="step-label">畫面預覽</span></span>
<span class="step" id="stopStep"><span class="step-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="4" y1="8" x2="4" y2="16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="20" y1="8" x2="20" y2="16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span><span class="step-label">設定停止線</span></span>
<span class="step" id="gateStep"><span class="step-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 5V19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M20 5V19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M4 9H20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M4 15H20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span><span class="step-label">設定閘門</span></span>
<span class="step" id="runStep"><span class="step-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 4.5L19 12L6 19.5V4.5Z" fill="currentColor"/></svg></span><span class="step-label">開始判斷</span></span>
</nav>
<section class="stage"><div class="wrap"><img id="stream" alt="影片第一幀"><canvas id="canvas"></canvas></div></section>
<section class="bottom">
<span class="status" id="status">正在準備影片第一幀…</span>
<label class="lane-default">預設車道數 <input id="defaultLane" type="number" min="1" value="1" disabled></label>
<button class="start" id="start" disabled><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M6 4.5L19 12L6 19.5V4.5Z" fill="currentColor"/></svg><span>開始判斷</span></button>
</section>
<section class="gate-panel"><h3>Gate 預覽（依設定順序）</h3><div class="gate-list" id="gateList"><span>尚未設定 Gate</span></div></section>
<p class="tip">按住左鍵拖曳：按下為 L、放開為 R。每條 Gate 自動使用目前的預設車道數。</p>
</main>
<aside class="tools">
<button class="tool active" id="draw" title="線段繪製" aria-label="線段繪製"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="6" cy="18" r="2.4" fill="currentColor"/><circle cx="18" cy="6" r="2.4" fill="currentColor"/><line x1="7.8" y1="16.4" x2="16.2" y2="7.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
<button class="tool" id="undo" title="上一步" aria-label="上一步"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M9 7L4.5 11.5L9 16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.5 11.5H14.5C17.5 11.5 19.5 13.8 19.5 16.5C19.5 19 17.7 20.7 15 20.9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
<button class="tool" id="redo" title="重做" aria-label="重做"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M15 7L19.5 11.5L15 16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M19.5 11.5H9.5C6.5 11.5 4.5 13.8 4.5 16.5C4.5 19 6.3 20.7 9 20.9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
<span class="divider"></span>
<button class="tool swatch" id="colour" title="切換 Gate 顏色" aria-label="切換 Gate 顏色"></button>
</aside>
</div>
</div>
<script>
const image=document.querySelector('#stream'),canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d'),status=document.querySelector('#status'),drawButton=document.querySelector('#draw'),undoButton=document.querySelector('#undo'),redoButton=document.querySelector('#redo'),colourButton=document.querySelector('#colour'),startButton=document.querySelector('#start'),defaultLaneInput=document.querySelector('#defaultLane'),gateList=document.querySelector('#gateList');
const steps={preview:document.querySelector('#previewStep'),stop:document.querySelector('#stopStep'),gate:document.querySelector('#gateStep'),run:document.querySelector('#runStep')},colours=['#24b576','#2987d8','#f0a326','#a55eea'];let stopLine=null,gates=[],redoStack=[],dragStart=null,dragEnd=null,drawing=true,colourIndex=0;
function resize(){canvas.width=image.clientWidth;canvas.height=image.clientHeight;paintAll()}image.onload=()=>{resize();progress('stop');status.textContent='請拉線設定停止線。'};image.onerror=()=>status.textContent='❌ 第一幀載入失敗，請確認主程式與影片檔。';image.src='/first_frame.jpg?'+Date.now();addEventListener('resize',resize);
function normal(event){const r=canvas.getBoundingClientRect();return{x:Number(((event.clientX-r.left)/r.width).toFixed(5)),y:Number(((event.clientY-r.top)/r.height).toFixed(5))}}function onScreen(p){return{x:p.x*canvas.width,y:p.y*canvas.height}}function paint(line,color,label){if(!line)return;const a=onScreen(line.L),b=onScreen(line.R);ctx.strokeStyle=color;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.fillStyle=color;ctx.font='bold 14px system-ui';ctx.fillText(label,a.x+7,a.y-8)}function paintAll(){ctx.clearRect(0,0,canvas.width,canvas.height);paint(stopLine,'#e75050','停止線');gates.forEach(g=>paint(g.line,g.color,`${g.gate}｜${g.lane} 車道`));if(dragStart&&dragEnd)paint({L:dragStart,R:dragEnd},colours[colourIndex],'預覽')}
function progress(active){const names=['preview','stop','gate','run'],at=names.indexOf(active);names.forEach((name,i)=>steps[name].className=`step ${i<at?'done':i===at?'active':''}`)}function refresh(){progress(stopLine?(gates.length>=3?'run':'gate'):'stop');defaultLaneInput.disabled=!stopLine;undoButton.disabled=!stopLine;redoButton.disabled=!redoStack.length;startButton.disabled=gates.length<3;colourButton.style.background=colours[colourIndex];drawButton.classList.toggle('active',drawing);gateList.innerHTML=gates.length?gates.map((g,i)=>`<label class="gate-row"><span>Gate ${i+1}</span><input type="number" min="1" value="${g.lane}" data-index="${i}"> 車道</label>`).join(''):'<span>尚未設定 Gate</span>';paintAll()}
function addLine(line){if(!stopLine){stopLine=line;status.textContent='✅ 停止線完成，請在下方確認預設車道數後標示 Gate 1。';defaultLaneInput.focus()}else{const lane=Number(defaultLaneInput.value);if(!Number.isInteger(lane)||lane<1){status.textContent='❌ 請填寫有效的預設車道數。';defaultLaneInput.focus();return}const order=gates.length+1;gates.push({gate:`Gate ${order}`,lane,station_m:order*10,line,color:colours[colourIndex]});redoStack=[];status.textContent=`✅ Gate ${order} 完成（${lane} 車道），可繼續標示 Gate ${order+1}。`}refresh()}
canvas.onpointerdown=e=>{if(e.button!==0||!drawing||!image.naturalWidth)return;dragStart=normal(e);dragEnd=dragStart;canvas.setPointerCapture(e.pointerId);paintAll();e.preventDefault()};canvas.onpointermove=e=>{if(!dragStart)return;dragEnd=normal(e);paintAll()};canvas.onpointerup=e=>{if(!dragStart)return;const line={L:dragStart,R:normal(e)};dragStart=dragEnd=null;if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);addLine(line)};canvas.onpointercancel=()=>{dragStart=dragEnd=null;paintAll()};
gateList.onchange=e=>{const input=e.target;if(!input.matches('[data-index]'))return;const gate=gates[Number(input.dataset.index)],lane=Number(input.value);if(!Number.isInteger(lane)||lane<1){input.value=gate.lane;return}gate.lane=lane;status.textContent=`${gate.gate} 已改為 ${lane} 車道。`;refresh()};drawButton.onclick=()=>{drawing=!drawing;status.textContent=drawing?'線段繪製已啟用。':'線段繪製已暫停。';refresh()};undoButton.onclick=()=>{if(gates.length)redoStack.push(gates.pop());else if(stopLine){redoStack.push({stop:true,line:stopLine});stopLine=null}status.textContent='已回到上一步。';refresh()};redoButton.onclick=()=>{const item=redoStack.pop();if(item){if(item.stop)stopLine=item.line;else gates.push(item);status.textContent='已重做。';refresh()}};colourButton.onclick=()=>{colourIndex=(colourIndex+1)%colours.length;status.textContent='已切換下一條 Gate 的顏色。';refresh()};
async function request(url){const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:url==='/save_points'?JSON.stringify({stop_line:{line:stopLine},gates:gates.map(({color,...gate})=>gate)}):undefined}),data=await response.json();if(!response.ok)throw Error(data.detail);return data}startButton.onclick=async()=>{try{await request('/save_points');await request('/start_processing');image.src='/video_feed?'+Date.now();progress('run');status.textContent='✅ 判斷已開始。'}catch(error){status.textContent='❌ '+error.message}};refresh();
</script>
</body>
</html>
